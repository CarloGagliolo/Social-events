name: Deploy Frontend to GitHub Pages

on:
  # Esegue l'action ogni volta che facciamo un "push" sul branch github-pages
  push:
    branches: ["github-pages"]
  # Permette di lanciare la build manualmente dalla schermata Actions di GitHub
  workflow_dispatch:

# Imposta i permessi necessari per fare la pubblicazione su GH Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permette una sola pubblicazione alla volta
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Job 1: Costruire (Build) il progetto React
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json
          
      - name: Installazione dipendenze
        run: npm ci

      - name: Build con Vite
        run: npm run build
        
      - name: Carica l'Artefatto (i file compilati)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

  # Job 2: Pubblicare (Deploy) su GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
